<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IIT Research Map</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--fg2:#6e6e73;--line:#d2d2d7;--accent:#0066cc}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--fg2:#a1a1a6;--line:#38383a;--accent:#2997ff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;padding:32px 16px;text-align:center}
h1{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0 0 16px}
p{font-size:18px;line-height:1.5;color:var(--fg2);margin:0 0 12px}
.rule{width:48px;height:2px;background:var(--accent);margin:24px auto;border:0}
small{font-size:13px;color:var(--fg2)}
</style>
</head>
<body>
<main>
<h1>IIT Research Map</h1>
<p>The dashboard is being updated.</p>
<p>A new version will be published here soon.</p>
<hr class="rule">
<small>No data is displayed on this page.</small>
</main>
</body>
</html>
